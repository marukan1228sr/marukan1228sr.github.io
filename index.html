<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計・振込管理">
  <title>家計・振込管理ナビ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-24 md:pb-12 antialiased">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-200 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight text-slate-900">家計・振込管理</h1>
          <p class="text-[11px] text-slate-500">口座別 入金必要額ナビ</p>
        </div>
      </div>

      <!-- 対象月切り替え -->
      <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
        <button id="prevMonthBtn" type="button" class="p-1.5 rounded text-slate-600 hover:bg-white active:bg-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <div class="px-2 font-bold text-xs sm:text-sm text-slate-800 tracking-wide" id="currentMonthLabel">2026年9月</div>
        <button id="nextMonthBtn" type="button" class="p-1.5 rounded text-slate-600 hover:bg-white active:bg-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 py-4 space-y-5">

    <!-- 全体収支サマリーカード（アコーディオン式） -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <!-- 収入・資産（アコーディオン付きカード） -->
      <div id="incomeSummaryCard" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs transition md:col-span-1">
        <div id="incomeCardHeader" class="flex justify-between items-start cursor-pointer group select-none">
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="text-xs font-semibold text-slate-500 group-hover:text-emerald-700 transition">総資産・収入合計</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">資産側</span>
            </div>
            <div class="mt-2 text-2xl font-bold text-slate-900 tracking-tight" id="totalIncomeDisplay">¥0</div>
            <div class="mt-1 text-xs text-slate-400" id="incomeDetailText">収入・確保資産の合計 (0件)</div>
          </div>
          <div class="flex items-center text-slate-400 group-hover:text-emerald-600 transition">
            <span class="text-[11px] font-semibold mr-1" id="incomeToggleLabel">開く</span>
            <svg id="incomeChevron" class="w-5 h-5 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <!-- 収入・資産 アコーディオンコンテンツ -->
        <div id="incomeAccordionContent" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-slate-800">収入・資産明細一覧</h3>
            <button id="addIncomeBtn" type="button" class="inline-flex items-center px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold rounded-lg shadow-xs transition cursor-pointer">
              <svg class="w-3.5 h-3.5 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              追加
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase">
                  <th class="py-1.5 px-1">項目名</th>
                  <th class="py-1.5 px-1 text-right">金額</th>
                  <th class="py-1.5 px-1 text-center w-14">操作</th>
                </tr>
              </thead>
              <tbody id="incomeTableBody" class="divide-y divide-slate-100 text-xs">
                <!-- JS生成 -->
              </tbody>
            </table>
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs font-bold text-slate-900">
            <span>収入合計</span>
            <span id="incomeSubtotalDisplay" class="text-emerald-600">¥0</span>
          </div>
        </div>
      </div>

      <!-- 支出予定 (引落合計) （アコーディオン付きカード） -->
      <div id="expenseSummaryCard" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs transition md:col-span-1">
        <div id="expenseCardHeader" class="flex justify-between items-start cursor-pointer group select-none">
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="text-xs font-semibold text-slate-500 group-hover:text-blue-700 transition">支出予定 (引落合計)</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-medium">口座引落</span>
            </div>
            <div class="mt-2 text-2xl font-bold text-slate-900 tracking-tight" id="totalExpensesDisplay">¥0</div>
            <div class="mt-1 text-xs text-slate-400" id="expenseDetailText">全口座の引落予定 合計</div>
          </div>
          <div class="flex items-center text-slate-400 group-hover:text-blue-600 transition">
            <span class="text-[11px] font-semibold mr-1" id="expenseToggleLabel">開く</span>
            <svg id="expenseChevron" class="w-5 h-5 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <!-- 支出 アコーディオンコンテンツ -->
        <div id="expenseAccordionContent" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <select id="accountFilterSelect" class="text-[11px] bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
              <option value="ALL">すべての口座</option>
            </select>
            <button id="addExpenseBtn" type="button" class="inline-flex items-center px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold rounded-lg shadow-xs transition cursor-pointer">
              <svg class="w-3.5 h-3.5 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              追加
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase">
                  <th class="py-1.5 px-1">項目名</th>
                  <th class="py-1.5 px-1">口座</th>
                  <th class="py-1.5 px-1 text-right">金額</th>
                  <th class="py-1.5 px-1 text-center w-14">操作</th>
                </tr>
              </thead>
              <tbody id="expenseTableBody" class="divide-y divide-slate-100 text-xs">
                <!-- JS生成 -->
              </tbody>
            </table>
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs font-bold text-slate-900">
            <span>引落合計</span>
            <span id="expenseSubtotalDisplay" class="text-blue-700">¥0</span>
          </div>
        </div>
      </div>

      <!-- 収支差額 -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs md:col-span-1">
        <div class="flex justify-between items-start">
          <span class="text-xs font-semibold text-slate-500">今月の収支差額</span>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" id="balanceBadge">計算中</span>
        </div>
        <div class="mt-2 text-2xl font-bold tracking-tight" id="balanceDisplay">¥0</div>
        <div class="mt-1 text-xs text-slate-400">（総資産・収入 − 支出予定合計）</div>
      </div>
    </section>

    <!-- 口座別 入金必要額 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs p-4 sm:p-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
        <div>
          <div class="flex items-center space-x-2">
            <h2 class="text-base font-bold text-slate-900">口座別 入金必要額</h2>
            <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-md">自動集計</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">今月、各口座にいくら用意・振込が必要か</p>
        </div>
        <button id="openAtmViewBtn" type="button" class="inline-flex items-center justify-center px-3 py-2 bg-slate-900 hover:bg-slate-800 active:bg-slate-700 text-white text-xs font-medium rounded-xl shadow transition cursor-pointer">
          <svg class="w-4 h-4 mr-1.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
          ATM用 振込チェック表
        </button>
      </div>

      <!-- 口座一覧グリッド -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-4" id="accountSummaryCards">
        <!-- JSで動的生成 -->
      </div>
    </section>

    <!-- 口座マスター設定 & データ管理 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <button id="toggleAccountSettingsBtn" type="button" class="w-full px-4 py-3 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition text-left cursor-pointer">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          <span class="text-xs font-bold text-slate-700">引落口座の設定・データのリセット</span>
        </div>
        <svg id="accountChevron" class="w-4 h-4 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
      </button>

      <div id="accountSettingsContent" class="hidden p-4 border-t border-slate-200 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">登録されている口座一覧</label>
          <div id="accountListContainer" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="text" id="newAccountInput" placeholder="新しい口座名（例: ゆうちょ銀行）" class="text-xs border border-slate-200 rounded-lg px-3 py-2 flex-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <button id="createAccountBtn" type="button" class="px-3 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold cursor-pointer">口座追加</button>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
          <span class="text-xs text-slate-400">初期状態に戻す</span>
          <button id="resetDataBtn" type="button" class="text-xs text-rose-600 hover:underline font-semibold cursor-pointer">データを初期化する</button>
        </div>
      </div>
    </section>

  </main>

  <!-- 追加・編集モーダル -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900">項目を追加</h3>
        <button id="closeModalBtn" type="button" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <form id="itemForm" class="space-y-3">
        <input type="hidden" id="modalType">
        <input type="hidden" id="modalItemId">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">項目・明細名</label>
          <input type="text" id="modalNameInput" required placeholder="例: 楽天カード" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (円)</label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-sm text-slate-400 font-bold">¥</span>
            <input type="number" id="modalAmountInput" required min="0" step="1" placeholder="0" class="w-full text-sm font-semibold pl-8 pr-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div id="modalAccountField">
          <label class="block text-xs font-semibold text-slate-600 mb-1">引落口座</label>
          <select id="modalAccountSelect" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </select>
        </div>

        <div class="flex space-x-2 pt-3">
          <button type="button" id="modalCancelBtn" class="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold cursor-pointer">キャンセル</button>
          <button type="submit" class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-md cursor-pointer">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ATM用 振込チェックモーダル -->
  <div id="atmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
        <div>
          <h3 class="text-base font-bold text-slate-900">ATM・銀行 振込チェックシート</h3>
          <p class="text-xs text-slate-500" id="atmModalMonth">2026年9月分</p>
        </div>
        <button id="closeAtmModalBtn" type="button" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <div class="overflow-y-auto flex-1 space-y-2.5 pr-1" id="atmListContainer">
        <!-- JS生成 -->
      </div>

      <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500 shrink-0">
        <span>タップして「振込済」にチェック</span>
        <button id="resetCheckBtn" type="button" class="text-emerald-700 font-semibold hover:underline cursor-pointer">チェックを全て解除</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-medium shadow-lg z-50 opacity-0 pointer-events-none transition duration-300">
    メッセージ
  </div>

  <script>
    // デフォルト初期データ（Excelデータ標準）
    const defaultData = {
      targetMonth: '2026-09',
      accounts: ['労働金庫', '山形銀行', '荘内銀行', '現金'],
      incomes: [
        { id: 'inc-1', name: '収入①', amount: 307000 },
        { id: 'inc-2', name: '収入②', amount: 95000 },
        { id: 'res-1', name: 'ママメガネ', amount: 20000 },
        { id: 'res-2', name: '七五三撮影', amount: 22000 }
      ],
      expenses: [
        { id: 'exp-1', name: '楽天カード', amount: 254000, account: '労働金庫' },
        { id: 'exp-2', name: 'オリコカード', amount: 20000, account: '労働金庫' },
        { id: 'exp-3', name: 'ガソリン', amount: 10000, account: '現金' },
        { id: 'exp-4', name: '高摘小', amount: 10000, account: '山形銀行' },
        { id: 'exp-5', name: 'サッカー', amount: 8000, account: '山形銀行' },
        { id: 'exp-6', name: '住宅ローン', amount: 80000, account: '労働金庫' },
        { id: 'exp-7', name: '奨学金', amount: 11000, account: '労働金庫' },
        { id: 'exp-8', name: '車', amount: 10000, account: '荘内銀行' },
        { id: 'exp-9', name: 'イオンカード', amount: 25000, account: '労働金庫' }
      ],
      transferredStatus: {}
    };

    // 保存状態を読み込み
    function loadSavedState() {
      try {
        const saved = localStorage.getItem('kakeibo_data_v4');
        if (saved) {
          const parsed = JSON.parse(saved);
          let loadedIncomes = Array.isArray(parsed.incomes) ? parsed.incomes : defaultData.incomes;
          if (Array.isArray(parsed.reserves) && parsed.reserves.length > 0) {
            parsed.reserves.forEach(r => {
              if (!loadedIncomes.some(i => i.id === r.id)) {
                loadedIncomes.push(r);
              }
            });
          }

          return {
            targetMonth: parsed.targetMonth || '2026-09',
            accounts: Array.isArray(parsed.accounts) && parsed.accounts.length > 0 ? parsed.accounts : defaultData.accounts,
            incomes: loadedIncomes,
            expenses: Array.isArray(parsed.expenses) ? parsed.expenses : defaultData.expenses,
            transferredStatus: (parsed.transferredStatus && typeof parsed.transferredStatus === 'object') ? parsed.transferredStatus : {}
          };
        }
      } catch (e) {
        console.error("データ読み込みエラー。初期状態を復元します。", e);
      }
      return JSON.parse(JSON.stringify(defaultData));
    }

    let state = loadSavedState();
    let isIncomeOpen = false;
    let isExpenseOpen = false;
    let currentAccountFilter = 'ALL';

    function toggleIncomeAccordion(forceState) {
      isIncomeOpen = typeof forceState === 'boolean' ? forceState : !isIncomeOpen;
      const content = document.getElementById('incomeAccordionContent');
      const chevron = document.getElementById('incomeChevron');
      const label = document.getElementById('incomeToggleLabel');

      if (isIncomeOpen) {
        content.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        if (label) label.textContent = '閉じる';
      } else {
        content.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        if (label) label.textContent = '開く';
      }
    }

    function toggleExpenseAccordion(forceState) {
      isExpenseOpen = typeof forceState === 'boolean' ? forceState : !isExpenseOpen;
      const content = document.getElementById('expenseAccordionContent');
      const chevron = document.getElementById('expenseChevron');
      const label = document.getElementById('expenseToggleLabel');

      if (isExpenseOpen) {
        content.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        if (label) label.textContent = '閉じる';
      } else {
        content.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        if (label) label.textContent = '開く';
      }
    }

    // 保存処理
    function saveData() {
      try {
        localStorage.setItem('kakeibo_data_v4', JSON.stringify(state));
      } catch (e) {
        console.error("データ保存エラー", e);
      }
    }

    // 口座カラーマップ
    const accountColorMap = {
      '労働金庫': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', badge: 'bg-blue-100 text-blue-800' },
      '山形銀行': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', badge: 'bg-emerald-100 text-emerald-800' },
      '荘内銀行': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', badge: 'bg-amber-100 text-amber-800' },
      '現金': { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-300', badge: 'bg-slate-200 text-slate-800' }
    };

    function getAccountColor(name) {
      return accountColorMap[name] || { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', badge: 'bg-purple-100 text-purple-800' };
    }

    function formatYen(num) {
      return '¥' + Number(num || 0).toLocaleString('ja-JP');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // モーダル編集・追加画面を開く
    function openModal(type, id = null) {
      document.getElementById('modalType').value = type;
      document.getElementById('modalItemId').value = id || '';
      const nameInput = document.getElementById('modalNameInput');
      const amountInput = document.getElementById('modalAmountInput');
      const accountField = document.getElementById('modalAccountField');
      const modalTitle = document.getElementById('modalTitle');

      if (type === 'expense') {
        accountField.classList.remove('hidden');
        if (id) {
          const item = state.expenses.find(e => e.id === id);
          if (item) {
            modalTitle.textContent = '引き落とし項目を編集';
            nameInput.value = item.name;
            amountInput.value = item.amount;
            document.getElementById('modalAccountSelect').value = item.account;
          }
        } else {
          modalTitle.textContent = '引き落とし項目を追加';
          nameInput.value = '';
          amountInput.value = '';
        }
      } else {
        accountField.classList.add('hidden');
        if (id) {
          const item = state.incomes.find(i => i.id === id);
          if (item) {
            modalTitle.textContent = '収入・資産項目を編集';
            nameInput.value = item.name;
            amountInput.value = item.amount;
          }
        } else {
          modalTitle.textContent = '収入・資産項目を追加';
          nameInput.value = '';
          amountInput.value = '';
        }
      }

      document.getElementById('itemModal').classList.remove('hidden');
      nameInput.focus();
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function deleteItem(type, id) {
      if (type === 'expense') {
        const item = state.expenses.find(e => e.id === id);
        state.expenses = state.expenses.filter(e => e.id !== id);
        showToast(`「${item ? item.name : '項目'}」を削除しました`);
      } else {
        const item = state.incomes.find(i => i.id === id);
        state.incomes = state.incomes.filter(i => i.id !== id);
        showToast(`「${item ? item.name : '項目'}」を削除しました`);
      }
      saveData();
      renderApp();
    }

    // 口座カード描画
    function renderAccountCards() {
      const container = document.getElementById('accountSummaryCards');
      if (!container) return;
      container.innerHTML = '';

      if (!state.transferredStatus) state.transferredStatus = {};

      state.accounts.forEach(acc => {
        const accExpenses = state.expenses.filter(e => e.account === acc);
        const total = accExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const isDone = !!state.transferredStatus[acc];
        const style = getAccountColor(acc);

        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border transition relative ${
          isDone ? 'bg-slate-50 border-slate-200 opacity-75' : `${style.bg} ${style.border}`
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold ${style.text}">${acc}</span>
            <label class="inline-flex items-center space-x-1 cursor-pointer">
              <input type="checkbox" ${isDone ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300 acc-check-box" data-acc="${acc}">
              <span class="text-[11px] font-medium ${isDone ? 'text-emerald-700 font-bold' : 'text-slate-500'}">
                ${isDone ? '入金済' : '未振込'}
              </span>
            </label>
          </div>
          <div class="text-xl font-bold text-slate-900 tracking-tight mt-0.5">
            ${formatYen(total)}
          </div>
          <div class="text-[11px] text-slate-500 mt-1 flex justify-between items-center">
            <span>引落件数: ${accExpenses.length}件</span>
            <button type="button" class="text-xs hover:underline text-slate-600 font-semibold view-acc-detail-btn" data-acc="${acc}">詳細</button>
          </div>
        `;
        container.appendChild(card);
      });

      // イベントリスナー
      container.querySelectorAll('.acc-check-box').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const acc = e.target.getAttribute('data-acc');
          if (!state.transferredStatus) state.transferredStatus = {};
          state.transferredStatus[acc] = e.target.checked;
          saveData();
          renderApp();
          showToast(`${acc}を「${e.target.checked ? '入金済' : '未振込'}」に設定しました`);
        });
      });

      container.querySelectorAll('.view-acc-detail-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const acc = e.target.getAttribute('data-acc');
          toggleExpenseAccordion(true);
          const filterSel = document.getElementById('accountFilterSelect');
          if (filterSel) {
            filterSel.value = acc;
            currentAccountFilter = acc;
            renderExpenseTable();
          }
          const card = document.getElementById('expenseSummaryCard');
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    // 引き落としテーブル描画
    function renderExpenseTable() {
      const tbody = document.getElementById('expenseTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const filtered = currentAccountFilter === 'ALL'
        ? state.expenses
        : state.expenses.filter(e => e.account === currentAccountFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-xs text-slate-400">該当する引き落とし明細はありません</td></tr>`;
      } else {
        filtered.forEach(item => {
          const style = getAccountColor(item.account);
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="py-2.5 px-1 font-semibold text-slate-800">${item.name}</td>
            <td class="py-2.5 px-1">
              <span class="inline-block text-[10px] px-1.5 py-0.5 rounded font-medium ${style.badge}">${item.account}</span>
            </td>
            <td class="py-2.5 px-1 text-right font-bold text-slate-900">${formatYen(item.amount)}</td>
            <td class="py-2.5 px-1 text-center space-x-1 whitespace-nowrap">
              <button type="button" class="edit-exp-btn text-slate-500 hover:text-blue-600 p-1 rounded cursor-pointer" data-id="${item.id}" title="編集">✏️</button>
              <button type="button" class="del-exp-btn text-slate-500 hover:text-rose-600 p-1 rounded cursor-pointer" data-id="${item.id}" title="削除">🗑️</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const subtotal = filtered.reduce((s, i) => s + Number(i.amount || 0), 0);
      const subtotalEl = document.getElementById('expenseSubtotalDisplay');
      if (subtotalEl) subtotalEl.textContent = formatYen(subtotal);

      // イベント割り当て（バブリング停止付き）
      tbody.querySelectorAll('.edit-exp-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal('expense', b.getAttribute('data-id'));
        });
      });
      tbody.querySelectorAll('.del-exp-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteItem('expense', b.getAttribute('data-id'));
        });
      });
    }

    // 収入テーブル描画
    function renderIncomeTable() {
      const tbody = document.getElementById('incomeTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (state.incomes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-xs text-slate-400">収入・資産の登録はありません</td></tr>`;
      } else {
        state.incomes.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="py-2.5 px-1 font-semibold text-slate-800">${item.name}</td>
            <td class="py-2.5 px-1 text-right font-bold text-emerald-700">${formatYen(item.amount)}</td>
            <td class="py-2.5 px-1 text-center space-x-1 whitespace-nowrap">
              <button type="button" class="edit-inc-btn text-slate-500 hover:text-blue-600 p-1 rounded cursor-pointer" data-id="${item.id}" title="編集">✏️</button>
              <button type="button" class="del-inc-btn text-slate-500 hover:text-rose-600 p-1 rounded cursor-pointer" data-id="${item.id}" title="削除">🗑️</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const subtotal = state.incomes.reduce((s, i) => s + Number(i.amount || 0), 0);
      const subtotalEl = document.getElementById('incomeSubtotalDisplay');
      if (subtotalEl) subtotalEl.textContent = formatYen(subtotal);

      // イベント割り当て（バブリング停止付き）
      tbody.querySelectorAll('.edit-inc-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal('income', b.getAttribute('data-id'));
        });
      });
      tbody.querySelectorAll('.del-inc-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteItem('income', b.getAttribute('data-id'));
        });
      });
    }

    // 口座管理描画
    function renderAccountSettings() {
      const container = document.getElementById('accountListContainer');
      if (!container) return;
      container.innerHTML = '';

      state.accounts.forEach(acc => {
        const span = document.createElement('span');
        span.className = 'inline-flex items-center text-xs bg-slate-100 border border-slate-200 px-2 py-1 rounded-lg font-medium text-slate-700';
        span.innerHTML = `
          <span>${acc}</span>
          <button type="button" class="ml-1.5 text-slate-400 hover:text-rose-600 del-acc-btn cursor-pointer" data-acc="${acc}">✕</button>
        `;
        container.appendChild(span);
      });

      container.querySelectorAll('.del-acc-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const acc = b.getAttribute('data-acc');
          if (state.accounts.length <= 1) {
            showToast('最低1つの口座が必要です');
            return;
          }
          if (state.expenses.some(exp => exp.account === acc)) {
            showToast(`「${acc}」を使用中の項目があるため削除できません`);
            return;
          }
          state.accounts = state.accounts.filter(a => a !== acc);
          if (state.transferredStatus) delete state.transferredStatus[acc];
          saveData();
          renderApp();
          showToast(`口座「${acc}」を削除しました`);
        });
      });
    }

    // プルダウン更新
    function updateSelectOptions() {
      const modalSelect = document.getElementById('modalAccountSelect');
      const filterSelect = document.getElementById('accountFilterSelect');

      if (modalSelect) {
        const prevModalVal = modalSelect.value;
        modalSelect.innerHTML = '';
        state.accounts.forEach(acc => {
          const opt = document.createElement('option');
          opt.value = acc;
          opt.textContent = acc;
          modalSelect.appendChild(opt);
        });
        if (prevModalVal && state.accounts.includes(prevModalVal)) {
          modalSelect.value = prevModalVal;
        }
      }

      if (filterSelect) {
        const prevFilterVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="ALL">すべての口座</option>';
        state.accounts.forEach(acc => {
          const opt = document.createElement('option');
          opt.value = acc;
          opt.textContent = acc;
          filterSelect.appendChild(opt);
        });
        if (prevFilterVal && (prevFilterVal === 'ALL' || state.accounts.includes(prevFilterVal))) {
          filterSelect.value = prevFilterVal;
        }
      }
    }

    // 全体再描画
    function renderApp() {
      try {
        const [year, month] = (state.targetMonth || '2026-09').split('-');
        const monthLabel = document.getElementById('currentMonthLabel');
        const atmMonth = document.getElementById('atmModalMonth');
        if (monthLabel) monthLabel.textContent = `${year}年${parseInt(month, 10)}月`;
        if (atmMonth) atmMonth.textContent = `${year}年${parseInt(month, 10)}月分`;

        const totalIncome = state.incomes.reduce((s, i) => s + Number(i.amount || 0), 0);
        const totalExpenses = state.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const balance = totalIncome - totalExpenses;

        const totIncEl = document.getElementById('totalIncomeDisplay');
        const incDetEl = document.getElementById('incomeDetailText');
        if (totIncEl) totIncEl.textContent = formatYen(totalIncome);
        if (incDetEl) incDetEl.textContent = `収入・確保資産の合計 (${state.incomes.length}件)`;

        const totExpEl = document.getElementById('totalExpensesDisplay');
        const expDetEl = document.getElementById('expenseDetailText');
        if (totExpEl) totExpEl.textContent = formatYen(totalExpenses);
        if (expDetEl) expDetEl.textContent = `全口座の引落予定 合計`;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const balanceBadge = document.getElementById('balanceBadge');

        if (balanceDisplay && balanceBadge) {
          if (balance >= 0) {
            balanceDisplay.className = 'mt-2 text-2xl font-bold tracking-tight text-emerald-600';
            balanceDisplay.textContent = `+${formatYen(balance)}`;
            balanceBadge.className = 'text-xs px-2 py-0.5 rounded-full font-medium bg-emerald-50 text-emerald-700';
            balanceBadge.textContent = '余剰あり';
          } else {
            balanceDisplay.className = 'mt-2 text-2xl font-bold tracking-tight text-rose-600';
            balanceDisplay.textContent = `-${formatYen(Math.abs(balance))}`;
            balanceBadge.className = 'text-xs px-2 py-0.5 rounded-full font-medium bg-rose-50 text-rose-700';
            balanceBadge.textContent = '不足 (赤字)';
          }
        }

        renderAccountCards();
        renderExpenseTable();
        renderIncomeTable();
        renderAccountSettings();
        updateSelectOptions();

      } catch (err) {
        console.error("renderAppエラー:", err);
      }
    }

    // ATM振込チェックモーダル表示
    function openAtmModal() {
      const container = document.getElementById('atmListContainer');
      if (!container) return;
      container.innerHTML = '';

      state.accounts.forEach(acc => {
        const accExpenses = state.expenses.filter(e => e.account === acc);
        const total = accExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const isChecked = !!state.transferredStatus[acc];
        const style = getAccountColor(acc);

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
          isChecked ? 'bg-emerald-50/80 border-emerald-300' : 'bg-white border-slate-200 hover:border-slate-300'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-5 h-5 rounded-md flex items-center justify-center border ${
              isChecked ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 bg-white'
            }">
              ${isChecked ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>' : ''}
            </div>
            <div>
              <div class="text-xs font-bold text-slate-900 flex items-center space-x-1.5">
                <span>${acc}</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded font-medium ${style.badge}">件数: ${accExpenses.length}</span>
              </div>
              <div class="text-[11px] text-slate-500 mt-0.5">${accExpenses.map(e => e.name).join(' / ') || '明細なし'}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold ${isChecked ? 'text-emerald-700' : 'text-slate-900'}">${formatYen(total)}</div>
            <div class="text-[10px] font-semibold ${isChecked ? 'text-emerald-600' : 'text-slate-400'}">${isChecked ? '入金完了' : '振込必要'}</div>
          </div>
        `;

        card.addEventListener('click', () => {
          if (!state.transferredStatus) state.transferredStatus = {};
          state.transferredStatus[acc] = !state.transferredStatus[acc];
          saveData();
          openAtmModal();
          renderApp();
        });

        container.appendChild(card);
      });

      document.getElementById('atmModal').classList.remove('hidden');
    }

    function initEvents() {
      renderApp();

      // 月変更
      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        let [y, m] = (state.targetMonth || '2026-09').split('-').map(Number);
        m -= 1;
        if (m < 1) { m = 12; y -= 1; }
        state.targetMonth = `${y}-${String(m).padStart(2, '0')}`;
        saveData();
        renderApp();
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {
        let [y, m] = (state.targetMonth || '2026-09').split('-').map(Number);
        m += 1;
        if (m > 12) { m = 1; y += 1; }
        state.targetMonth = `${y}-${String(m).padStart(2, '0')}`;
        saveData();
        renderApp();
      });

      // サマリーカードアコーディオン開閉
      document.getElementById('incomeCardHeader').addEventListener('click', () => toggleIncomeAccordion());
      document.getElementById('expenseCardHeader').addEventListener('click', () => toggleExpenseAccordion());

      // フィルター
      document.getElementById('accountFilterSelect').addEventListener('change', (e) => {
        e.stopPropagation();
        currentAccountFilter = e.target.value;
        renderExpenseTable();
      });

      // 追加ボタン（アコーディオン内）
      document.getElementById('addIncomeBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        openModal('income');
      });
      document.getElementById('addExpenseBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        openModal('expense');
      });

      // モーダル操作
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      document.getElementById('modalCancelBtn').addEventListener('click', closeModal);

      // フォーム保存
      document.getElementById('itemForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.getElementById('modalType').value;
        const id = document.getElementById('modalItemId').value;
        const name = document.getElementById('modalNameInput').value.trim();
        const amount = Number(document.getElementById('modalAmountInput').value);
        const account = document.getElementById('modalAccountSelect').value;

        if (!name || isNaN(amount)) return;

        if (id) {
          if (type === 'expense') {
            const item = state.expenses.find(exp => exp.id === id);
            if (item) { item.name = name; item.amount = amount; item.account = account; }
          } else {
            const item = state.incomes.find(inc => inc.id === id);
            if (item) { item.name = name; item.amount = amount; }
          }
          showToast(`「${name}」を更新しました`);
        } else {
          const newId = 'id-' + Date.now();
          if (type === 'expense') {
            state.expenses.push({ id: newId, name, amount, account });
          } else {
            state.incomes.push({ id: newId, name, amount });
          }
          showToast(`「${name}」を追加しました`);
        }

        saveData();
        closeModal();
        renderApp();
      });

      // 口座設定アコーディオン
      document.getElementById('toggleAccountSettingsBtn').addEventListener('click', () => {
        const content = document.getElementById('accountSettingsContent');
        const chevron = document.getElementById('accountChevron');
        const isHidden = content.classList.contains('hidden');
        if (isHidden) {
          content.classList.remove('hidden');
          chevron.classList.add('rotate-180');
        } else {
          content.classList.add('hidden');
          chevron.classList.remove('rotate-180');
        }
      });

      // 口座追加
      document.getElementById('createAccountBtn').addEventListener('click', () => {
        const input = document.getElementById('newAccountInput');
        const val = input.value.trim();
        if (!val) return;
        if (state.accounts.includes(val)) {
          showToast('同名の口座が既に存在します');
          return;
        }
        state.accounts.push(val);
        input.value = '';
        saveData();
        renderApp();
        showToast(`口座「${val}」を追加しました`);
      });

      // データ初期化
      document.getElementById('resetDataBtn').addEventListener('click', () => {
        if (confirm('入力されたデータを初期の状態に戻しますか？')) {
          state = JSON.parse(JSON.stringify(defaultData));
          saveData();
          renderApp();
          showToast('データを初期化しました');
        }
      });

      // ATMモーダル
      document.getElementById('openAtmViewBtn').addEventListener('click', openAtmModal);
      document.getElementById('closeAtmModalBtn').addEventListener('click', () => {
        document.getElementById('atmModal').classList.add('hidden');
      });
      document.getElementById('resetCheckBtn').addEventListener('click', () => {
        state.transferredStatus = {};
        saveData();
        openAtmModal();
        renderApp();
        showToast('振込チェックをリセットしました');
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initEvents);
    } else {
      initEvents();
    }
  </script>
</body>
</html>
