.segmented button.active{background:#fff;color:#1e2126;box-shadow:0 2px 8px rgba(0,0,0,.06)}\n\n    @media (min-width:680px){\n      .app{padding-top:24px}\n      .modal-backdrop{align-items:center;padding:24px}\n      .modal{border-radius:26px;max-height:86vh}\n    }\n  <\/style>\n<\/head>\n<body>\n  <main class=\"app\">\n    <div class=\"topbar\">\n      <div class=\"brand\"><a class=\"brand-mark\" href=\"#household\" aria-label=\"家計・振込管理を開く\" title=\"家計・振込管理を開く\" style=\"text-decoration:none\">R<\/a><div>楽天カード 速報チェッカー<\/div><\/div>\n      <button class=\"icon-btn\" id=\"settingsShortcut\" aria-label=\"設定\">⚙︎<\/button>\n    <\/div>\n\n    <section class=\"hero\">\n      <div class=\"eyebrow\">現在の引落見込み額<\/div>\n      <div class=\"hero-amount\" id=\"grandTotal\">¥0<\/div>\n      <div class=\"hero-sub\" id=\"heroPeriod\">—<\/div>\n      <div class=\"hero-grid\">\n        <div class=\"mini-stat\"><span>楽天側表示額<\/span><strong id=\"statementTotal\">¥0<\/strong><\/div>\n        <div class=\"mini-stat\"><span>未反映速報<\/span><strong id=\"alertTotal\">¥0<\/strong><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"month-panel\">\n      <div class=\"eyebrow\" style=\"margin:0 2px 10px\">引落月<\/div>\n      <div class=\"year-row\">\n        <button class=\"nav-round\" id=\"prevYear\" aria-label=\"前年\">‹<\/button>\n        <strong id=\"yearLabel\">2026年<\/strong>\n        <button class=\"nav-round\" id=\"nextYear\" aria-label=\"翌年\">›<\/button>\n      <\/div>\n      <div class=\"months\" id=\"months\"><\/div>\n      <div style=\"margin:10px 3px 0;font-size:11px;color:var(--muted);line-height:1.5\">月タブは「利用月」ではなく、口座から引き落とされる月で管理します。<\/div>\n    <\/section>\n\n    <div class=\"section-title\">カード別<\/div>\n\n    <section class=\"card-accordion pink\" data-card=\"pink\">\n      <button class=\"card-head\" type=\"button\">\n        <div class=\"card-brand-row\"><div><div class=\"card-brand\">楽天PINKカード<\/div><div class=\"card-type\">RAKUTEN PINK CARD<\/div><\/div><div class=\"card-logo\">R<\/div><\/div>\n        <div class=\"card-chip-row\"><div class=\"card-chip\"><\/div><div class=\"contactless\">)))<\/div><\/div>\n        <div class=\"card-bottom\">\n          <div class=\"card-meta\"><span id=\"pinkCount\">0件<\/span><span id=\"pinkAlertCount\">速報0件<\/span><\/div>\n          <div class=\"card-total\"><strong id=\"pinkTotal\">¥0<\/strong><span class=\"chev\">▼<\/span><\/div>\n        <\/div>\n      <\/button>\n      <div class=\"acc-body\"><div class=\"acc-inner\">\n        <div class=\"divider\"><\/div>\n        <div class=\"stat-rows\">\n          <div class=\"stat-box\"><span>本明細の合計<\/span><strong id=\"pinkStatement\">¥0<\/strong><\/div>\n          <div class=\"stat-box\"><span>未反映速報<\/span><strong id=\"pinkAlerts\">¥0<\/strong><\/div>\n          <div class=\"stat-box full\"><span>楽天側表示額<\/span><input class=\"inline-edit\" id=\"pinkOfficial\" inputmode=\"numeric\" placeholder=\"未設定\" aria-label=\"PINKカード楽天側表示額\" /><\/div>\n        <\/div>\n        <div class=\"audit-box neutral\" id=\"pinkAudit\"><div class=\"audit-title\">明細チェック<\/div><div class=\"audit-detail\">楽天側表示額を読み取ると、小計との一致を確認できます。<\/div><\/div>\n        <div class=\"official-note\">楽天アプリのその引落月の表示額が分かる場合は入力してください。「表示額＋まだ本明細に反映されていない速報」を引落見込み額として使います。<\/div>\n        <div class=\"action-grid\">\n          <button class=\"action-btn primary import-btn\" data-card=\"pink\" data-source=\"statement\">📷 本明細を読む<\/button>\n          <button class=\"action-btn secondary import-btn\" data-card=\"pink\" data-source=\"alert\">⚡ 速報を読む<\/button>\n        <\/div>\n        <button class=\"manual-link manual-btn\" data-card=\"pink\">＋ 明細を手動追加<\/button>\n      <\/div><\/div>\n    <\/section>\n\n    <section class=\"card-accordion silver\" data-card=\"silver\">\n      <button class=\"card-head\" type=\"button\">\n        <div class=\"card-brand-row\"><div><div class=\"card-brand\">楽天カード<\/div><div class=\"card-type\">RAKUTEN CARD<\/div><\/div><div class=\"card-logo\">R<\/div><\/div>\n        <div class=\"card-chip-row\"><div class=\"card-chip\"><\/div><div class=\"contactless\">)))<\/div><\/div>\n        <div class=\"card-bottom\">\n          <div class=\"card-meta\"><span id=\"silverCount\">0件<\/span><span id=\"silverAlertCount\">速報0件<\/span><\/div>\n          <div class=\"card-total\"><strong id=\"silverTotal\">¥0<\/strong><span class=\"chev\">▼<\/span><\/div>\n        <\/div>\n      <\/button>\n      <div class=\"acc-body\"><div class=\"acc-inner\">\n        <div class=\"divider\"><\/div>\n        <div class=\"stat-rows\">\n          <div class=\"stat-box\"><span>本明細の合計<\/span><strong id=\"silverStatement\">¥0<\/strong><\/div>\n          <div class=\"stat-box\"><span>未反映速報<\/span><strong id=\"silverAlerts\">¥0<\/strong><\/div>\n          <div class=\"stat-box full\"><span>楽天側表示額<\/span><input class=\"inline-edit\" id=\"silverOfficial\" inputmode=\"numeric\" placeholder=\"未設定\" aria-label=\"楽天カード楽天側表示額\" /><\/div>\n        <\/div>\n        <div class=\"audit-box neutral\" id=\"silverAudit\"><div class=\"audit-title\">明細チェック<\/div><div class=\"audit-detail\">楽天側表示額を読み取ると、小計との一致を確認できます。<\/div><\/div>\n        <div class=\"official-note\">本明細をAIで読み取った際に表示額が見つかれば自動更新されます。手入力で上書きもできます。<\/div>\n        <div class=\"action-grid\">\n          <button class=\"action-btn primary import-btn\" data-card=\"silver\" data-source=\"statement\">📷 本明細を読む<\/button>\n          <button class=\"action-btn secondary import-btn\" data-card=\"silver\" data-source=\"alert\">⚡ 速報を読む<\/button>\n        <\/div>\n        <button class=\"manual-link manual-btn\" data-card=\"silver\">＋ 明細を手動追加<\/button>\n      <\/div><\/div>\n    <\/section>\n\n    <div class=\"section-title\">明細<\/div>\n    <section class=\"transactions-panel\">\n      <div class=\"toolbar\">\n        <input class=\"search\" id=\"searchInput\" type=\"search\" placeholder=\"店名・明細名を検索\" />\n        <div class=\"filters\" id=\"filters\">\n          <button class=\"filter-chip active\" data-filter=\"all\">すべて<\/button>\n          <button class=\"filter-chip\" data-filter=\"statement\">本明細<\/button>\n          <button class=\"filter-chip\" data-filter=\"alert\">速報<\/button>\n          <button class=\"filter-chip\" data-filter=\"pink\">PINK<\/button>\n          <button class=\"filter-chip\" data-filter=\"silver\">銀<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"txList\" class=\"tx-list\"><\/div>\n    <\/section>\n\n    <section class=\"settings\" id=\"settingsSection\">\n      <button class=\"settings-head\" id=\"settingsHead\">\n        <span>⚙︎ 設定・データ管理<\/span><span class=\"settings-chev\">▼<\/span>\n      <\/button>\n      <div class=\"settings-body\"><div class=\"settings-inner\">\n        <div class=\"subsection\" style=\"margin-top:0;padding-top:12px;border-top:0\">\n          <h3>Gemini API設定<\/h3>\n          <p>APIキーはこの端末のブラウザ内に保存されます。GitHubのコードには書き込まれません。画像読取時のみGoogle Gemini APIへ直接送信します。<\/p>\n          <div class=\"field\"><label for=\"modelInput\">モデル名<\/label><input class=\"text-input\" id=\"modelInput\" value=\"gemini-2.5-flash\" /><\/div>\n          <div class=\"field\"><label for=\"apiKeyInput\">APIキー<\/label>\n            <div class=\"input-row\"><input class=\"text-input\" id=\"apiKeyInput\" type=\"password\" placeholder=\"AIza…\" /><button class=\"small-btn\" id=\"toggleApiKey\">表示<\/button><\/div>\n          <\/div>\n          <div class=\"settings-actions\"><button id=\"checkApi\">接続を確認<\/button><button id=\"deleteApi\">APIキーを削除<\/button><\/div>\n          <div class=\"api-status\" id=\"apiStatus\">● 未確認<\/div>\n        <\/div>\n        <div class=\"subsection\">\n          <h3>バックアップ<\/h3>\n          <p>明細・楽天側表示額をJSONで保存／復元できます。APIキーはバックアップに含めません。<\/p>\n          <div class=\"settings-actions\"><button id=\"exportData\">バックアップを保存<\/button><button id=\"importData\">バックアップから復元<\/button><\/div>\n          <input id=\"backupFile\" type=\"file\" accept=\"application/json\" hidden />\n        <\/div>\n        <div class=\"subsection\">\n          <h3>データ削除<\/h3>\n          <p>選択中の引落月をカード別に削除できます。誤操作防止のため確認を表示します。<\/p>\n          <div class=\"settings-actions\"><button id=\"deletePinkMonth\">この月のPINKだけ削除<\/button><button id=\"deleteSilverMonth\">この月の楽天カードだけ削除<\/button><\/div>\n          <div class=\"settings-actions\"><button id=\"deleteMonth\">この引落月を両方削除<\/button><button id=\"deleteAll\">すべての月を削除<\/button><\/div>\n        <\/div>\n      <\/div><\/div>\n    <\/section>\n\n    <div class=\"fab\"><button id=\"quickAdd\">＋ 明細を追加<\/button><\/div>\n  <\/main>\n\n  <input id=\"imagePicker\" type=\"file\" accept=\"image/*\" multiple hidden />\n\n  <div class=\"modal-backdrop\" id=\"modalBackdrop\">\n    <div class=\"modal\" role=\"dialog\" aria-modal=\"true\">\n      <div class=\"modal-handle\"><\/div>\n      <div class=\"modal-head\"><h2 id=\"modalTitle\">明細を確認<\/h2><button class=\"close-btn\" id=\"modalClose\">×<\/button><\/div>\n      <div class=\"modal-body\" id=\"modalBody\"><\/div>\n      <div class=\"modal-footer\"><button class=\"btn-cancel\" id=\"modalCancel\">キャンセル<\/button><button class=\"btn-save\" id=\"modalSave\">保存<\/button><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"loading\" id=\"loading\"><div class=\"loading-card\"><div class=\"spinner\"><\/div><strong id=\"loadingTitle\">Geminiが読み取っています<\/strong><span id=\"loadingSub\">画像を解析中です…<\/span><\/div><\/div>\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(() => {\n  'use strict';\n\n  const STORAGE_KEY = 'rakuten_alert_checker_v3';\n  const DATA_VERSION = 6;\n  const API_KEY_STORAGE = 'rakuten_alert_checker_gemini_key';\n  const MODEL_STORAGE = 'rakuten_alert_checker_gemini_model';\n\n  const yen = n => '¥' + Math.round(Number(n || 0)).toLocaleString('ja-JP');\n  const pad2 = n => String(n).padStart(2,'0');\n  const now = new Date();\n\n  const defaultState = {\n    selectedYear: now.getFullYear(),\n    selectedMonth: now.getMonth() + 1,\n    transactions: [],\n    officialTotals: {},\n    mergedHistory: []\n  };\n\n  let state = loadState();\n  let activeFilter = 'all';\n  let modalMode = null;\n  let modalPayload = null;\n  let pendingImport = null;\n  saveState();\n\n  const $ = sel => document.querySelector(sel);\n  const $$ = sel => [...document.querySelectorAll(sel)];\n\n  function loadState(){\n    try{\n      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');\n      const loaded = raw && typeof raw === 'object' ? {...defaultState, ...raw} : structuredClone(defaultState);\n      loaded.transactions = Array.isArray(loaded.transactions) ? loaded.transactions : [];\n      loaded.officialTotals = loaded.officialTotals && typeof loaded.officialTotals === 'object' ? loaded.officialTotals : {};\n      loaded.mergedHistory = Array.isArray(loaded.mergedHistory) ? loaded.mergedHistory : [];\n      // v3以前: 明細が利用日だけで月分けされていたため、引落月を追加して移行する。\n      // 楽天側表示額が選択中カード・月にある場合は、その引落月を優先する。\n      loaded.transactions.forEach(t=>{\n        if(!t.debitMonth){\n          const selectedKey=`${loaded.selectedYear}-${pad2(loaded.selectedMonth)}`;\n          const usageKey=t.date ? t.date.slice(0,7) : selectedKey;\n          const [uy,um]=usageKey.split('-').map(Number);\n          const candidates=Object.keys(loaded.officialTotals)\n            .filter(k=>k.endsWith(`:${t.card}`))\n            .map(k=>k.split(':')[0])\n            .filter(k=>{\n              const [y,m]=k.split('-').map(Number);\n              const diff=(y-uy)*12+(m-um);\n              return diff>=0 && diff<=2;\n            }).sort();\n          t.debitMonth=candidates[0] || usageKey;\n        }\n      });\n      // v5: 過去版で同一スクショ取込バッチ内に完全一致行が重複登録されたケースを安全に整理。\n      // importBatchId が同じものだけを対象にするため、別々の買い物を勝手に消さない。\n      if(Number(loaded.dataVersion||0) < 5){\n        const seen=new Set();\n        loaded.transactions=loaded.transactions.filter(t=>{\n          if(!t.importBatchId || t.merged) return true;\n          const sig=[t.importBatchId,t.card,t.source,t.debitMonth,t.date,Number(t.amount),normalizeMerchant(t.merchant)].join('|');\n          if(seen.has(sig)) return false;\n          seen.add(sig); return true;\n        });\n      }\n      // v6: 旧版で日々のAI取込ごとに累積した同じ本明細を整理する。\n      // OCRによる店名表記の軽い揺れもまとめるが、同じバッチ内の最大件数は残す。\n      // そのため実在する「同日・同店・同額」の複数取引は維持される。\n      if(Number(loaded.dataVersion||0) < 6){\n        const baseGroups=new Map();\n        loaded.transactions.forEach(t=>{\n          if(t.source!=='statement' || !t.importBatchId || t.merged)return;\n          const key=[t.card,t.debitMonth,t.date,Number(t.amount)].join('|');\n          if(!baseGroups.has(key))baseGroups.set(key,[]);\n          baseGroups.get(key).push(t);\n        });\n        const removeIds=new Set();\n        baseGroups.forEach(baseGroup=>{\n          const clusters=[];\n          [...baseGroup].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(t=>{\n            let cluster=clusters.find(c=>merchantSimilarity(c[0].merchant,t.merchant)>=.60);\n            if(!cluster){cluster=[];clusters.push(cluster)}\n            cluster.push(t);\n          });\n          clusters.forEach(group=>{\n            const byBatch=new Map();\n            group.forEach(t=>{if(!byBatch.has(t.importBatchId))byBatch.set(t.importBatchId,[]);byBatch.get(t.importBatchId).push(t)});\n            if(byBatch.size<2)return;\n            const keepCount=Math.max(...[...byBatch.values()].map(x=>x.length));\n            group.slice(keepCount).forEach(t=>removeIds.add(t.id));\n          });\n        });\n        loaded.transactions=loaded.transactions.filter(t=>!removeIds.has(t.id));\n      }\n      loaded.dataVersion = DATA_VERSION;\n      return loaded;\n    }catch(e){ return structuredClone(defaultState); }\n  }\n  // 取込順に依存させない。速報と本明細を同じカード・引落月・利用日・金額で1対1に対応させる。\n  function reconcileAlerts(){\n    const alerts=state.transactions.filter(t=>t.source==='alert');\n    const statements=state.transactions.filter(t=>t.source==='statement' && !t.merged);\n    const previous=new Map(alerts.map(t=>[t.id,t.mergedInto||null]));\n    const statementGroups=new Map();\n    const matchKey=t=>[t.card,t.debitMonth,t.date,Number(t.amount)].join('|');\n    statements.forEach(t=>{\n      const key=matchKey(t);\n      if(!statementGroups.has(key))statementGroups.set(key,[]);\n      statementGroups.get(key).push(t);\n    });\n    for(const group of statementGroups.values())group.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));\n    alerts.forEach(t=>{t.merged=false;delete t.mergedInto;delete t.mergedAt});\n    let newlyMerged=0;\n    alerts.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(alert=>{\n      const statement=statementGroups.get(matchKey(alert))?.shift();\n      if(!statement)return;\n      alert.merged=true;alert.mergedInto=statement.id;alert.mergedAt=Date.now();\n      if(previous.get(alert.id)!==statement.id)newlyMerged++;\n      if(!state.mergedHistory.some(h=>h.alertId===alert.id && h.statementId===statement.id))\n        state.mergedHistory.push({alertId:alert.id,statementId:statement.id,at:Date.now()});\n    });\n    return newlyMerged;\n  }\n  function saveState(){ const newlyMerged=reconcileAlerts(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return newlyMerged; }\n  function monthKey(y=state.selectedYear,m=state.selectedMonth){ return `${y}-${pad2(m)}`; }\n  function officialKey(card,y=state.selectedYear,m=state.selectedMonth){ return `${monthKey(y,m)}:${card}`; }\n  function id(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }\n\n  function normalizeDigits(v){\n    return String(v ?? '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));\n  }\n  function numberFrom(v){\n    const n = Number(normalizeDigits(v).replace(/[^0-9.-]/g,''));\n    return Number.isFinite(n) ? Math.abs(Math.round(n)) : 0;\n  }\n  function amountFrom(v){\n    const raw=normalizeDigits(v).trim();\n    const negative=/[-−]|\\(.*\\)|取消|返金|ｷｬﾝｾﾙ|キャンセル/.test(raw);\n    const n=Number(raw.replace(/[^0-9.]/g,''));\n    if(!Number.isFinite(n)) return 0;\n    return (negative?-1:1)*Math.round(n);\n  }\n  function cleanMerchant(v){ return String(v || '').trim().replace(/\\s+/g,' '); }\n  function normalizeMerchant(v){\n    return cleanMerchant(v).toLowerCase().replace(/マスター国内利用|カード利用速報|利用速報|楽天カード|mzz/g,'').replace(/[\\s　・･._\\-\\(\\)（）/]/g,'');\n  }\n  function merchantSimilarity(a,b){\n    const x=normalizeMerchant(a),y=normalizeMerchant(b);\n    if(!x || !y)return 0;\n    if(x===y)return 1;\n    if(Math.min(x.length,y.length)>=4 && (x.includes(y)||y.includes(x)))return .94;\n    const grams=s=>{const out=[];for(let i=0;i<s.length-1;i++)out.push(s.slice(i,i+2));return out};\n    const ax=grams(x),by=grams(y);if(!ax.length||!by.length)return 0;\n    const counts=new Map();by.forEach(g=>counts.set(g,(counts.get(g)||0)+1));\n    let hits=0;ax.forEach(g=>{const n=counts.get(g)||0;if(n){hits++;counts.set(g,n-1)}});\n    return 2*hits/(ax.length+by.length);\n  }\n  function findExistingStatement(item,pool,consumed){\n    return pool\n      .filter(t=>!consumed.has(t.id) && !t.merged && t.source==='statement' && t.card===item.card && t.debitMonth===item.debitMonth && t.date===item.date && Number(t.amount)===Number(item.amount))\n      .map(t=>({item:t,score:merchantSimilarity(t.merchant,item.merchant)}))\n      .filter(x=>x.score>=.60)\n      .sort((a,b)=>b.score-a.score || (b.item.createdAt||0)-(a.item.createdAt||0))[0]?.item || null;\n  }\n\n  function parseDateFlexible(v, fallbackYear=state.selectedYear, fallbackDebitMonth=state.selectedMonth){\n    if(!v){\n      const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;\n    }\n    let s = normalizeDigits(v).trim().replace(/[年月\\.]/g,'-').replace(/日/g,'').replace(/\\//g,'-');\n    const parts = s.split('-').filter(Boolean).map(Number);\n    if(parts.length >= 3 && parts[0] > 1000) return `${parts[0]}-${pad2(parts[1])}-${pad2(parts[2])}`;\n    if(parts.length >= 2){\n      const mm=parts[0], dd=parts[1];\n      // 引落月が1〜2月で、利用日が前年12月など年をまたぐケースを補正。\n      let y=fallbackYear;\n      if(mm > fallbackDebitMonth + 2) y=fallbackYear-1;\n      return `${y}-${pad2(mm)}-${pad2(dd)}`;\n    }\n    const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;\n  }\n\n  function dateDistance(a,b){\n    const da = new Date(a+'T00:00:00');\n    const db = new Date(b+'T00:00:00');\n    return Math.abs((da-db)/86400000);\n  }\n\n  function getMonthTransactions(){\n    return state.transactions.filter(t => !t.merged && t.debitMonth === monthKey());\n  }\n  function getCardTransactions(card){ return getMonthTransactions().filter(t => t.card === card); }\n  function sum(list){ return list.reduce((a,b)=>a+Number(b.amount||0),0); }\n\n  function cardStats(card){\n    const list = getCardTransactions(card);\n    const confirmed = list.filter(t=>t.source==='statement');\n    const alerts = list.filter(t=>t.source==='alert');\n    const statementSum = sum(confirmed);\n    const alertSum = sum(alerts);\n    const officialRaw = state.officialTotals[officialKey(card)];\n    const hasOfficial = Number.isFinite(Number(officialRaw)) && Number(officialRaw) >= 0 && String(officialRaw) !== '';\n    const official = hasOfficial ? Number(officialRaw) : null;\n    const base = official !== null ? official : statementSum;\n    const auditDiff = official !== null ? statementSum - official : null;\n    return {list, confirmed, alerts, statementSum, alertSum, official, auditDiff, total:base+alertSum};\n  }\n\n  function render(){\n    renderMonths();\n    const p = cardStats('pink');\n    const s = cardStats('silver');\n    const grand = p.total + s.total;\n    const st = (p.official !== null ? p.official : p.statementSum) + (s.official !== null ? s.official : s.statementSum);\n    const al = p.alertSum + s.alertSum;\n\n    $('#grandTotal').textContent = yen(grand);\n    $('#statementTotal').textContent = yen(st);\n    $('#alertTotal').textContent = yen(al);\n    $('#heroPeriod').textContent = `${state.selectedYear}年${state.selectedMonth}月 引落分・PINKカード＋楽天カード`;\n    $('#yearLabel').textContent = `${state.selectedYear}年`;\n\n    setCardUI('pink',p);\n    setCardUI('silver',s);\n    renderTransactions();\n  }\n\n  function setCardUI(card,stats){\n    const cap = card==='pink' ? 'pink' : 'silver';\n    $(`#${cap}Total`).textContent = yen(stats.total);\n    $(`#${cap}Count`).textContent = `${stats.list.length}件`;\n    $(`#${cap}AlertCount`).textContent = `速報${stats.alerts.length}件`;\n    $(`#${cap}Statement`).textContent = yen(stats.statementSum);\n    $(`#${cap}Alerts`).textContent = yen(stats.alertSum);\n    const inp = $(`#${cap}Official`);\n    if(document.activeElement !== inp){ inp.value = stats.official === null ? '' : stats.official.toLocaleString('ja-JP'); }\n    const audit = $(`#${cap}Audit`);\n    if(audit){\n      if(stats.official === null){\n        audit.className='audit-box neutral';\n        audit.innerHTML=`<div class=\"audit-title\">明細チェック<\/div><div class=\"audit-detail\">本明細 ${stats.confirmed.length}件・小計 ${yen(stats.statementSum)}。楽天側表示額が分かると一致確認できます。<\/div>`;\n      }else if(stats.auditDiff === 0){\n        audit.className='audit-box good';\n        audit.innerHTML=`<div class=\"audit-title\">✓ 金額一致<\/div><div class=\"audit-detail\">本明細 ${stats.confirmed.length}件・小計 ${yen(stats.statementSum)} ＝ 楽天側表示額 ${yen(stats.official)}<\/div>`;\n      }else{\n        const abs=Math.abs(stats.auditDiff);\n        const direction=stats.auditDiff>0?'明細小計が多い':'明細小計が少ない';\n        audit.className='audit-box warn';\n        audit.innerHTML=`<div class=\"audit-title\">⚠ 金額が一致していません<\/div><div class=\"audit-detail\">本明細 ${stats.confirmed.length}件・小計 ${yen(stats.statementSum)} ／ 楽天側 ${yen(stats.official)} ／ 差額 ${yen(abs)}（${direction}）<\/div>`;\n      }\n    }\n  }\n\n  function renderMonths(){\n    const box = $('#months'); box.innerHTML='';\n    for(let m=1;m<=12;m++){\n      const b=document.createElement('button');\n      b.className='month-chip'+(m===state.selectedMonth?' active':'');\n      b.textContent=`${m}月`; b.dataset.month=m;\n      b.onclick=()=>{state.selectedMonth=m; saveState(); render(); setTimeout(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),20)};\n      box.appendChild(b);\n    }\n    setTimeout(()=>box.querySelector('.active')?.scrollIntoView({inline:'center',block:'nearest'}),0);\n  }\n\n  function renderTransactions(){\n    const q = $('#searchInput').value.trim().toLowerCase();\n    let list = getMonthTransactions().slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));\n    if(activeFilter==='statement' || activeFilter==='alert') list=list.filter(t=>t.source===activeFilter);\n    if(activeFilter==='pink' || activeFilter==='silver') list=list.filter(t=>t.card===activeFilter);\n    if(q) list=list.filter(t=>cleanMerchant(t.merchant).toLowerCase().includes(q));\n    const box=$('#txList'); box.innerHTML='';\n    if(!list.length){ box.innerHTML='<div class=\"empty\">この引落月の明細はまだありません。<br>カードを開いて「本明細を読む」または「速報を読む」から追加できます。<\/div>'; return; }\n    list.forEach(t=>{\n      const item=document.createElement('div'); item.className='tx-item';\n      const cardLabel=t.card==='pink'?'PINK':'銀';\n      const src=t.source==='statement'?'本明細':'速報';\n      const d=t.date ? `${Number(t.date.slice(5,7))}/${Number(t.date.slice(8,10))}` : '—';\n      item.innerHTML=`\n        <div class=\"tx-main\">\n          <div class=\"tx-top\"><span class=\"tx-date\">${escapeHtml(d)}<\/span><span class=\"pill ${t.source}\">${src}<\/span><span class=\"pill ${t.card}\">${cardLabel}<\/span><\/div>\n          <div class=\"tx-name\">${escapeHtml(t.merchant || '明細名なし')}<\/div>\n        <\/div>\n        <div><div class=\"tx-amount\">${yen(t.amount)}<\/div><button class=\"tx-more\" aria-label=\"編集\">•••<\/button><\/div>`;\n      item.querySelector('.tx-more').onclick=()=>openEditModal(t.id);\n      box.appendChild(item);\n    });\n  }\n\n  function escapeHtml(s){ return String(s).replace(/[&<>'\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[c])); }\n\n  // Accordion\n  $$('.card-accordion .card-head').forEach(head=>head.addEventListener('click',()=>{\n    const acc=head.closest('.card-accordion');\n    acc.classList.toggle('open');\n    const body=acc.querySelector('.acc-body');\n    body.style.maxHeight=acc.classList.contains('open') ? body.scrollHeight+'px' : '0px';\n  }));\n  window.addEventListener('resize',()=>$$('.card-accordion.open .acc-body').forEach(b=>b.style.maxHeight=b.scrollHeight+'px'));\n\n  $('#settingsHead').onclick=()=>{\n    $('#settingsSection').classList.toggle('open');\n    const body=$('#settingsSection .settings-body');\n    body.style.maxHeight=$('#settingsSection').classList.contains('open') ? body.scrollHeight+'px' : '0px';\n  };\n  $('#settingsShortcut').onclick=()=>{\n    $('#settingsSection').classList.add('open');\n    const body=$('#settingsSection .settings-body'); body.style.maxHeight=body.scrollHeight+'px';\n    $('#settingsSection').scrollIntoView({behavior:'smooth',block:'start'});\n  };\n\n  $('#prevYear').onclick=()=>{state.selectedYear--;saveState();render()};\n  $('#nextYear').onclick=()=>{state.selectedYear++;saveState();render()};\n\n  ['pink','silver'].forEach(card=>{\n    $(`#${card}Official`).addEventListener('change',e=>{\n      const v=e.target.value.trim();\n      if(!v) delete state.officialTotals[officialKey(card)];\n      else state.officialTotals[officialKey(card)] = numberFrom(v);\n      saveState(); render();\n    });\n  });\n\n  // Filters/search\n  $('#searchInput').addEventListener('input',renderTransactions);\n  $$('#filters .filter-chip').forEach(b=>b.onclick=()=>{\n    $$('#filters .filter-chip').forEach(x=>x.classList.remove('active')); b.classList.add('active');\n    activeFilter=b.dataset.filter; renderTransactions();\n  });\n\n  // API settings\n  $('#modelInput').value = localStorage.getItem(MODEL_STORAGE) || 'gemini-2.5-flash';\n  $('#apiKeyInput').value = localStorage.getItem(API_KEY_STORAGE) || '';\n  $('#modelInput').addEventListener('change',e=>localStorage.setItem(MODEL_STORAGE,e.target.value.trim()||'gemini-2.5-flash'));\n  $('#apiKeyInput').addEventListener('change',e=>localStorage.setItem(API_KEY_STORAGE,e.target.value.trim()));\n  $('#toggleApiKey').onclick=()=>{\n    const inp=$('#apiKeyInput'); const show=inp.type==='password'; inp.type=show?'text':'password'; $('#toggleApiKey').textContent=show?'隠す':'表示';\n  };\n  $('#deleteApi').onclick=()=>{\n    localStorage.removeItem(API_KEY_STORAGE); $('#apiKeyInput').value=''; setApiStatus('未確認',''); toast('APIキーを削除しました');\n  };\n  $('#checkApi').onclick=async()=>{\n    const key=$('#apiKeyInput').value.trim(); const model=$('#modelInput').value.trim()||'gemini-2.5-flash';\n    if(!key){setApiStatus('APIキーを入力してください','bad');return}\n    localStorage.setItem(API_KEY_STORAGE,key); localStorage.setItem(MODEL_STORAGE,model);\n    showLoading('Geminiへ接続しています','APIキーとモデルを確認中…');\n    try{\n      const data=await geminiRequest(model,key,[{text:'「OK」の2文字だけを返してください。'}],false);\n      const text=extractGeminiText(data).trim();\n      hideLoading(); setApiStatus(text?'接続OK':'接続できました','good');\n    }catch(err){hideLoading();setApiStatus(humanApiError(err),'bad')}\n  };\n  function setApiStatus(text,kind){ const el=$('#apiStatus'); el.textContent='● '+text; el.className='api-status '+(kind||''); }\n\n  // Import buttons\n  $$('.import-btn').forEach(btn=>btn.onclick=()=>{\n    const key=$('#apiKeyInput').value.trim() || localStorage.getItem(API_KEY_STORAGE) || '';\n    if(!key){ toast('先にGemini APIキーを設定してください'); $('#settingsShortcut').click(); return; }\n    pendingImport={card:btn.dataset.card,source:btn.dataset.source};\n    $('#imagePicker').value=''; $('#imagePicker').click();\n  });\n  $('#imagePicker').addEventListener('change',async e=>{\n    const files=[...e.target.files]; if(!files.length || !pendingImport) return;\n    const {card,source}=pendingImport;\n    await analyzeImages(files,card,source);\n  });\n\n  async function analyzeImages(files,card,source){\n    const key=$('#apiKeyInput').value.trim() || localStorage.getItem(API_KEY_STORAGE) || '';\n    const model=$('#modelInput').value.trim() || localStorage.getItem(MODEL_STORAGE) || 'gemini-2.5-flash';\n    localStorage.setItem(API_KEY_STORAGE,key); localStorage.setItem(MODEL_STORAGE,model);\n    showLoading('Geminiが明細を読み取っています',`${files.length}枚の画像をまとめて解析中…`);\n    try{\n      const parts=[{text:buildPrompt(source,card,files.length)}];\n      for(let i=0;i<files.length;i++){\n        $('#loadingSub').textContent=`${i+1}/${files.length}枚目を準備中…`;\n        const image=await compressImage(files[i]);\n        parts.push({inline_data:{mime_type:image.mime,data:image.base64}});\n      }\n      $('#loadingSub').textContent='スクロールの重複部分も含めて照合中…';\n      const data=await geminiRequest(model,key,parts,true);\n      const parsed=parseGeminiJson(extractGeminiText(data));\n      const officialTotal=Number.isFinite(Number(parsed.officialTotal)) ? numberFrom(parsed.officialTotal) : null;\n      const detectedPeriod=typeof parsed.detectedPeriod==='string' ? parsed.detectedPeriod : null;\n      const rows=Array.isArray(parsed.transactions) ? parsed.transactions : [];\n      const batch=id();\n      const normalizedRaw=rows.map((x,index)=>({\n        id:id(),\n        debitMonth:monthKey(),\n        date:parseDateFlexible(x.date,state.selectedYear,state.selectedMonth),\n        merchant:cleanMerchant(x.merchant || (source==='alert'?'カード利用速報':'明細名なし')),\n        amount:amountFrom(x.amount),\n        occurrenceCount:Math.max(1,Math.min(10,Number.parseInt(x.occurrenceCount,10)||1)),\n        card,source,createdAt:Date.now(),importBatchId:batch,importIndex:index\n      })).filter(x=>x.amount!==0);\n      const {items:normalized,removed:batchDuplicates}=dedupeImportBatch(normalizedRaw);\n      hideLoading();\n      if(!normalized.length && officialTotal===null){ toast('明細を読み取れませんでした'); return; }\n      if(source==='statement') normalized.forEach(x=>x.matchCandidates=findAlertCandidates(x));\n      openReviewModal({card,source,items:normalized,officialTotal,detectedPeriod,debitMonth:monthKey(),batchDuplicates});\n    }catch(err){ hideLoading(); console.error(err); alert('AI読取に失敗しました。\\n\\n'+humanApiError(err)); }\n  }\n\n  function buildPrompt(source,card,imageCount=1){\n    const sourceText=source==='statement'?'楽天カードアプリ等の「本明細・利用明細」':'カード利用速報・速報通知';\n    return `あなたはクレジットカード明細の画像読取専用AIです。\\n`+\n      `この画像群は ${card==='pink'?'楽天PINKカード':'楽天カード'} の ${sourceText} です。\\n`+\n      `ユーザーは ${state.selectedYear}年${state.selectedMonth}月を「口座から引き落とされる月」として管理しています。利用日が前月でも、画像に表示されている明細はすべて抽出してください。\\n`+\n      `${imageCount}枚は同じ明細画面を縦にスクロールしながら撮った連続スクリーンショットの可能性があります。画像同士で同じ行が重なっていたら、その重複だけを1件にまとめてください。\\n`+\n      `ただし、同一日・同一店・同額の取引が実際に複数行表示されている場合は、別取引として行数分を残してください。\\n`+\n      `返答は必ずJSONだけにしてください。説明文やMarkdownは禁止です。\\n`+\n      `形式: {\"officialTotal\": number|null, \"detectedPeriod\":\"YYYY-MM\"|null, \"transactions\":[{\"date\":\"YYYY-MM-DD または MM-DD\",\"merchant\":\"利用先・店名。速報で店名が無ければカード利用速報\",\"amount\":1234,\"occurrenceCount\":1}]}\\n`+\n      `ルール:\\n`+\n      `- 金額は円記号・カンマなしの正の整数。\\n`+\n      `- occurrenceCount は「同一日・同一店名・同一金額」が1枚の画像内に同時に何行見えているか、その最大数にする。別画像にも同じ行が写っただけなら増やさない。1枚の中に同じ内容が2行あれば2にする。\\n`+\n      `- 複数画像で上下の店名・日付・並び順が共通する行はスクロールの重なりなので同じ1件として扱う。別々の画像に写った回数を occurrenceCount にしない。\\n`+\n      `- 日付は各取引の「利用日」。画面上部の2026/10等を取引日として使わない。\\n`+\n      `- 画面上部などに対象期間の2026/10等が明確なら detectedPeriod に入れる。\\n`+\n      `- officialTotal は選択月の「お支払い金額」「ご請求金額」「今回請求額」だけを入れる。「ご利用可能額」「利用残高」「現在の利用額」「利用可能枠」「合計利用額」は入れない。請求額が明確でなければ null。\\n`+\n      `- 取消・返金・キャンセルの金額が請求計算に含まれる行は除外せず、amount を負の整数にする。元売上と取消の両方があれば両方残す。\\n`+\n      `- 分割払いは商品の総額ではなく、その月の明細行に表示された今回支払額だけを amount にする。\\n`+\n      `- 画面下部の広告・おすすめ情報・メニュー・ボタンの金額は取引として抽出しない。\\n`+\n      `- 読めない文字を勝手に推測しすぎない。店名不明なら「明細名不明」。\\n`+\n      `- 取引行の店名、利用日、金額を漏れなく抽出することを最優先する。`;\n  }\n\n  async function geminiRequest(model,key,parts,jsonMode){\n    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;\n    const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.1}};\n    if(jsonMode) body.generationConfig.responseMimeType='application/json';\n    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});\n    const text=await res.text();\n    let data; try{data=JSON.parse(text)}catch{data={raw:text}}\n    if(!res.ok){const err=new Error(data?.error?.message || `HTTP ${res.status}`);err.status=res.status;throw err}\n    return data;\n  }\n  function extractGeminiText(data){ return data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || ''; }\n  function parseGeminiJson(text){\n    const cleaned=String(text).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();\n    try{return JSON.parse(cleaned)}catch(e){\n      const m=cleaned.match(/\\{[\\s\\S]*\\}/); if(m) return JSON.parse(m[0]); throw new Error('Geminiの返答をJSONとして読み取れませんでした');\n    }\n  }\n  function humanApiError(err){\n    const m=String(err?.message||err);\n    if(err?.status===400) return 'リクエストが正しくありません。モデル名や画像を確認してください。\\n'+m;\n    if(err?.status===401 || err?.status===403) return 'APIキーの権限または設定を確認してください。\\n'+m;\n    if(err?.status===404) return 'モデル名が見つかりません。Geminiのモデル名を確認してください。\\n'+m;\n    if(err?.status===429) return 'Gemini APIの利用上限に達した可能性があります。少し時間を置いてください。';\n    return m;\n  }\n\n  function compressImage(file){\n    return new Promise((resolve,reject)=>{\n      const reader=new FileReader();\n      reader.onerror=reject;\n      reader.onload=()=>{\n        const img=new Image();\n        img.onerror=reject;\n        img.onload=()=>{\n          const max=1800; let w=img.width,h=img.height;\n          if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}\n          const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;\n          const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);\n          const dataUrl=canvas.toDataURL('image/jpeg',0.88);\n          resolve({mime:'image/jpeg',base64:dataUrl.split(',')[1]});\n        };\n        img.src=reader.result;\n      };\n      reader.readAsDataURL(file);\n    });\n  }\n\n  function txSignature(item){\n    return [item.card,item.source,item.debitMonth,item.date,Number(item.amount),normalizeMerchant(item.merchant)].join('|');\n  }\n\n  // 連続スクショの重なり対策。完全一致行は同一取引候補としてまとめる。\n  // 本当に同一内容の取引が複数ある場合はGeminiの occurrenceCount で必要件数を残す。\n  function dedupeImportBatch(items){\n    const groups=new Map();\n    for(const item of items){\n      const sig=txSignature(item);\n      if(!groups.has(sig)) groups.set(sig,[]);\n      groups.get(sig).push(item);\n    }\n    const result=[]; let removed=0;\n    for(const group of groups.values()){\n      const desired=Math.max(1,...group.map(x=>Number(x.occurrenceCount)||1));\n      const base=group[0];\n      for(let i=0;i<desired;i++){\n        const src=group[i] || base;\n        const copy={...src,id:i===0?src.id:id(),occurrenceCount:desired,occurrenceOrdinal:i+1};\n        result.push(copy);\n      }\n      removed += Math.max(0,group.length-desired);\n    }\n    result.sort((a,b)=>(a.importIndex||0)-(b.importIndex||0) || (a.occurrenceOrdinal||1)-(b.occurrenceOrdinal||1));\n    return {items:result,removed};\n  }\n\n  function statementAudit(items,officialTotal){\n    const statementItems=items.filter(x=>x.source==='statement' && x.amount!==0);\n    const subtotal=sum(statementItems);\n    const hasOfficial=officialTotal!==null && Number.isFinite(Number(officialTotal));\n    return {count:statementItems.length,subtotal,official:hasOfficial?Number(officialTotal):null,diff:hasOfficial?subtotal-Number(officialTotal):null};\n  }\n\n  // Matching alerts -> statements\n  function findAlertCandidates(statement){\n    const alerts=state.transactions.filter(t=>!t.merged && t.card===statement.card && t.source==='alert' && t.debitMonth===statement.debitMonth && Number(t.amount)===Number(statement.amount));\n    return alerts.map(a=>{\n      const dd=dateDistance(a.date,statement.date);\n      const am=normalizeMerchant(a.merchant), sm=normalizeMerchant(statement.merchant);\n      const merchantUseful=am && sm && !/速報|不明/.test(a.merchant);\n      let score=0;\n      if(dd===0) score+=70; else if(dd<=2) score+=55; else if(dd<=7) score+=35; else score-=20;\n      if(merchantUseful && (am.includes(sm)||sm.includes(am))) score+=30;\n      return {...a,score,dayDiff:dd};\n    }).filter(x=>x.score>=35).sort((a,b)=>b.score-a.score);\n  }\n\n  function openReviewModal(payload){\n    modalMode='review'; modalPayload=payload;\n    $('#modalTitle').textContent=payload.source==='statement'?'本明細の読取結果':'速報の読取結果';\n    $('#modalSave').textContent='この内容で登録';\n    renderReviewModal(); openModal();\n  }\n  function renderReviewModal(){\n    const p=modalPayload; const body=$('#modalBody');\n    const cardName=p.card==='pink'?'楽天PINKカード':'楽天カード';\n    const target=p.debitMonth || monthKey();\n    const [ty,tm]=target.split('-');\n    let periodNote='';\n    if(p.detectedPeriod && /^\\d{4}-\\d{2}$/.test(p.detectedPeriod) && p.detectedPeriod!==target){\n      periodNote=`<div class=\"match-hint warn\">⚠ 画像では ${escapeHtml(p.detectedPeriod)} が検出されました。登録先の引落月を確認してください。<\/div>`;\n    }\n    const audit=statementAudit(p.items,p.officialTotal);\n    let auditNote='';\n    if(p.source==='statement' && audit.official!==null){\n      auditNote=`<div class=\"match-hint\">楽天側表示額 ${yen(audit.official)} を検出しました。今回のスクショが上部だけでも、保存済みの明細全体と登録後に比較します。<\/div>`;\n    }\n    const duplicateNote=p.batchDuplicates?`<div class=\"match-hint\">✓ スクショ重複候補 ${p.batchDuplicates}件を読取結果から除外しました。<\/div>`:'';\n    body.innerHTML=`<div class=\"review-summary\"><strong>${cardName}<\/strong>・${p.source==='statement'?'本明細':'速報'}<br><strong>${Number(ty)}年${Number(tm)}月 引落分<\/strong>へ ${p.items.length}件を照合します。<br>利用日は前月でもそのまま残ります。登録前に日付・明細名・金額を修正できます。${p.source==='statement'?' 既存の同じ明細は追加せず、新しく写った行だけ追加します。下の過去明細は残ります。一致する速報は自動統合します。':''}${periodNote}${duplicateNote}${auditNote}<\/div>`;\n    const debitWrap=document.createElement('div'); debitWrap.className='field';\n    debitWrap.innerHTML=`<label>登録先の引落月<\/label><input class=\"text-input\" id=\"reviewDebitMonth\" type=\"month\" value=\"${escapeHtml(target)}\">`;\n    body.appendChild(debitWrap);\n    if(p.source==='statement'){\n      const wrap=document.createElement('div');wrap.className='field';\n      wrap.innerHTML=`<label>楽天側表示額（画像から検出した場合）<\/label><input class=\"text-input\" id=\"reviewOfficial\" inputmode=\"numeric\" placeholder=\"未検出・未設定\" value=\"${p.officialTotal===null?'':p.officialTotal.toLocaleString('ja-JP')}\">`;\n      body.appendChild(wrap);\n    }\n    p.items.forEach((item,index)=>{\n      const candidates=item.matchCandidates||[];\n      const div=document.createElement('div');div.className='review-item';div.dataset.index=index;\n      let hint='';\n      const exactCandidates=candidates.filter(x=>x.dayDiff===0);\n      if(p.source==='statement' && exactCandidates.length) hint=`<div class=\"match-hint\">✓ 同じ日付・金額の速報${exactCandidates.length}件と一致候補。登録時に1件ずつ対応させます。<\/div>`;\n      else if(p.source==='statement' && candidates.length===1) hint=`<div class=\"match-hint warn\">△ 日付が近い同額速報があります。日付が違うため自動統合しません。<\/div>`;\n      div.innerHTML=`\n        <div class=\"review-grid\">\n          <div><div class=\"review-label\">日付<\/div><input class=\"r-date\" type=\"date\" value=\"${escapeHtml(item.date)}\"><\/div>\n          <div><div class=\"review-label\">金額<\/div><input class=\"r-amount\" inputmode=\"numeric\" value=\"${item.amount.toLocaleString('ja-JP')}\"><\/div>\n          <div class=\"full\"><div class=\"review-label\">明細名・利用先<\/div><input class=\"r-merchant\" value=\"${escapeHtml(item.merchant)}\"><\/div>\n        <\/div>\n        ${hint}\n        <button class=\"remove-review\">この行を除外<\/button>`;\n      div.querySelector('.remove-review').onclick=()=>{p.items.splice(index,1);renderReviewModal()};\n      body.appendChild(div);\n    });\n  }\n\n  function collectReviewInputs(){\n    if(modalMode!=='review')return;\n    const p=modalPayload;\n    $$('#modalBody .review-item').forEach((div,i)=>{\n      const it=p.items[i];\n      it.date=div.querySelector('.r-date').value;\n      it.amount=numberFrom(div.querySelector('.r-amount').value);\n      it.merchant=cleanMerchant(div.querySelector('.r-merchant').value);\n      if(p.source==='statement') it.matchCandidates=findAlertCandidates(it);\n    });\n    const debitInp=$('#reviewDebitMonth');\n    if(debitInp && debitInp.value){ p.debitMonth=debitInp.value; p.items.forEach(it=>it.debitMonth=p.debitMonth); }\n    if(p.source==='statement'){\n      const inp=$('#reviewOfficial'); if(inp) p.officialTotal=inp.value.trim()?numberFrom(inp.value):null;\n      p.items.forEach(it=>it.matchCandidates=findAlertCandidates(it));\n    }\n  }\n\n  // Manual / edit modals\n  $$('.manual-btn').forEach(btn=>btn.onclick=()=>openManualModal(btn.dataset.card));\n  $('#quickAdd').onclick=()=>openManualModal('pink',true);\n  function openManualModal(defaultCard='pink',allowCardSwitch=false){\n    modalMode='manual';\n    const d=new Date();\n    modalPayload={id:id(),debitMonth:monthKey(),date:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,merchant:'',amount:0,card:defaultCard,source:'statement',createdAt:Date.now(),allowCardSwitch};\n    $('#modalTitle').textContent='明細を手動追加'; $('#modalSave').textContent='追加する'; renderSingleEdit(); openModal();\n  }\n  function openEditModal(txId){\n    const tx=state.transactions.find(t=>t.id===txId); if(!tx)return;\n    modalMode='edit'; modalPayload={...tx};\n    $('#modalTitle').textContent='明細を編集'; $('#modalSave').textContent='変更を保存'; renderSingleEdit(true); openModal();\n  }\n  function renderSingleEdit(isEdit=false){\n    const p=modalPayload; const body=$('#modalBody');\n    body.innerHTML=`\n      <div class=\"segmented\" id=\"sourceSeg\"><button data-v=\"statement\" class=\"${p.source==='statement'?'active':''}\">本明細<\/button><button data-v=\"alert\" class=\"${p.source==='alert'?'active':''}\">速報<\/button><\/div>\n      <div class=\"segmented\" id=\"cardSeg\"><button data-v=\"pink\" class=\"${p.card==='pink'?'active':''}\">PINKカード<\/button><button data-v=\"silver\" class=\"${p.card==='silver'?'active':''}\">楽天カード<\/button><\/div>\n      <div class=\"field\"><label>引落月<\/label><input class=\"text-input\" id=\"editDebitMonth\" type=\"month\" value=\"${escapeHtml(p.debitMonth || monthKey())}\"><\/div>\n      <div class=\"field\"><label>利用日<\/label><input class=\"text-input\" id=\"editDate\" type=\"date\" value=\"${escapeHtml(p.date)}\"><\/div>\n      <div class=\"field\"><label>明細名・利用先<\/label><input class=\"text-input\" id=\"editMerchant\" value=\"${escapeHtml(p.merchant)}\" placeholder=\"例：ヤマザワ松見町店\"><\/div>\n      <div class=\"field\"><label>金額<\/label><input class=\"text-input\" id=\"editAmount\" inputmode=\"numeric\" value=\"${p.amount?p.amount.toLocaleString('ja-JP'):''}\" placeholder=\"0\"><\/div>\n      ${isEdit?'<div class=\"subsection\"><button class=\"danger-btn\" id=\"deleteTx\">この明細を削除<\/button><\/div>':''}`;\n    $$('#sourceSeg button').forEach(b=>b.onclick=()=>{$$('#sourceSeg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.source=b.dataset.v});\n    $$('#cardSeg button').forEach(b=>b.onclick=()=>{$$('#cardSeg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.card=b.dataset.v});\n    if(isEdit) $('#deleteTx').onclick=()=>{ if(confirm('この明細を削除しますか？')){ state.transactions=state.transactions.filter(t=>t.id!==p.id);saveState();closeModal();render();toast('明細を削除しました'); } };\n  }\n\n  function openModal(){ $('#modalBackdrop').classList.add('show'); document.body.style.overflow='hidden'; }\n  function closeModal(){ $('#modalBackdrop').classList.remove('show'); document.body.style.overflow=''; modalMode=null; modalPayload=null; }\n  $('#modalClose').onclick=closeModal; $('#modalCancel').onclick=closeModal;\n  $('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});\n\n  $('#modalSave').onclick=()=>{\n    if(modalMode==='review'){\n      collectReviewInputs();\n      const p=modalPayload;\n      const validRaw=p.items.filter(x=>x.amount!==0 && x.date);\n      const {items:valid,removed:internalDuplicates}=dedupeImportBatch(validRaw);\n      const audit=statementAudit(valid,p.officialTotal);\n      // 上部だけのスクショを日々追加できる差分更新。過去の本明細は削除しない。\n      const replaceStatement=false;\n\n      const existingBefore=state.transactions.slice();\n      const addedThisSave=[];\n      let merged=0,duplicates=internalDuplicates;\n      const existingCounts=new Map();\n      existingBefore.forEach(t=>{\n        const sig=txSignature(t); existingCounts.set(sig,(existingCounts.get(sig)||0)+1);\n      });\n      const incomingSeen=new Map();\n      const consumedStatements=new Set();\n      valid.forEach(item=>{\n        const sig=txSignature(item);\n        const ordinal=(incomingSeen.get(sig)||0)+1; incomingSeen.set(sig,ordinal);\n        if(p.source==='statement'){\n          const existing=findExistingStatement(item,existingBefore,consumedStatements);\n          if(existing){\n            consumedStatements.add(existing.id);\n            // 新しい読取の方が詳しい場合だけ店名表記を改善する。\n            if(cleanMerchant(item.merchant).length>cleanMerchant(existing.merchant).length)existing.merchant=item.merchant;\n            duplicates++;return;\n          }\n        }else if(ordinal<=(existingCounts.get(sig)||0)){duplicates++;return;}\n        delete item.matchCandidates; delete item.occurrenceCount; delete item.occurrenceOrdinal;\n        state.transactions.push(item); addedThisSave.push(item);\n      });\n      if(p.source==='statement' && p.officialTotal!==null){ const [yy,mm]=p.debitMonth.split('-').map(Number); state.officialTotals[officialKey(p.card,yy,mm)] = p.officialTotal; }\n      merged=saveState(); closeModal(); render();\n      let msg=`${addedThisSave.length}件を登録しました`;\n      if(p.source==='statement') msg+='・既存明細と差分照合';\n      if(merged) msg+=`・速報${merged}件を統合`;\n      if(duplicates) msg+=`・重複${duplicates}件を除外`;\n      toast(msg); return;\n    }\n    if(modalMode==='manual' || modalMode==='edit'){\n      const p=modalPayload;\n      p.debitMonth=$('#editDebitMonth').value || monthKey(); p.date=$('#editDate').value; p.merchant=cleanMerchant($('#editMerchant').value)||'明細名なし'; p.amount=amountFrom($('#editAmount').value);\n      if(!p.date || !p.amount){toast('日付と金額を入力してください');return}\n      if(modalMode==='manual'){\n        if(isDuplicateExisting(p) && !confirm('同じ日付・金額・明細名のデータがあります。追加しますか？')) return;\n        state.transactions.push(p);\n      }else{\n        const idx=state.transactions.findIndex(t=>t.id===p.id); if(idx>=0)state.transactions[idx]=p;\n      }\n      const wasManual = modalMode==='manual';\n      saveState();closeModal();render();toast(wasManual?'明細を追加しました':'変更を保存しました');\n    }\n  };\n\n  function isDuplicateExisting(item,pool=state.transactions){\n    return pool.some(t=>!t.merged && t.card===item.card && t.source===item.source && t.debitMonth===item.debitMonth && Number(t.amount)===Number(item.amount) && t.date===item.date && normalizeMerchant(t.merchant)===normalizeMerchant(item.merchant));\n  }\n\n  // Backup\n  $('#exportData').onclick=()=>{\n    const payload={version:DATA_VERSION,exportedAt:new Date().toISOString(),state};\n    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});\n    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`rakuten-checker-backup-${monthKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを書き出しました');\n  };\n  $('#importData').onclick=()=>{$('#backupFile').value='';$('#backupFile').click()};\n const $=id=>document.getElementById(id), keys=['kakeibo_data_v5','rakuten_alert_checker_v3'];
